<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord File Uploader</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #2f3136; color: white; margin: 0; }
        .upload-card { background: #36393f; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 100%; }
        input[type="file"] { margin: 20px 0; display: block; width: 100%; color: #b9bbbe; }
        button { background: #5865F2; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px;}
        button:hover { background: #4752C4; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="upload-card">
    <h2>Upload File to Discord</h2>
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Send to Discord</button>
    <div id="status"></div>
</div>

<script>
async function uploadFile() {
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    
    // 1. Check if a file was selected
    if (fileInput.files.length === 0) {
        status.style.color = "#faa61a";
        status.innerText = "Please select a file first.";
        return;
    }

    const file = fileInput.files[0];
    status.style.color = "#ffffff";
    status.innerText = "Uploading to Discord...";

    // 2. Prepare the multi-part form data required by Discord
    const formData = new FormData();
    formData.append('files[0]', file); 
    
    // Optional: Add a text message to accompany the file
    formData.append('payload_json', JSON.stringify({
        content: `New file uploaded: **${file.name}**`
    }));

    // 3. YOUR DISCORD WEBHOOK URL
    const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1539770621951737909/Bx7T4BYAMEFnfCy9uAnZK4J-V372VWSfZp3eW_-6Ffj3Kl677WiFfUCZxsPgEz5BEsY2';

    try {
        // 4. Send the request directly from the browser
        const response = await fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            status.style.color = "#43b581";
            status.innerText = "✅ File successfully sent!";
            fileInput.value = ""; // Clear the input
        } else {
            const errData = await response.text();
            status.style.color = "#f04747";
            status.innerText = "❌ Discord rejected the upload.";
            console.error("Discord Error:", errData);
        }
    } catch (err) {
        status.style.color = "#f04747";
        status.innerText = "❌ Network error occurred.";
        console.error("Network Error:", err);
    }
}
</script>

</body>
</html>
