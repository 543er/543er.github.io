<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stahování souborů</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 40px auto; 
            max-width: 800px;
            background: #0d1117; /* Moderní tmavý režim z GitHubu */
            color: #c9d1d9; 
            padding: 0 20px;
        }
        h1 { 
            border-bottom: 1px solid #21262d; 
            padding-bottom: 10px; 
            font-size: 24px;
            color: #f0f6fc;
        }
        ul { 
            list-style: none; 
            padding: 0; 
        }
        li { 
            margin: 10px 0; 
            background: #161b22; 
            padding: 16px; 
            border: 1px solid #30363d; 
            border-radius: 6px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        a { 
            text-decoration: none; 
            color: #58a6ff; 
            font-weight: 600; 
        }
        a:hover { 
            text-decoration: underline; 
        }
        .info {
            color: #8b949e;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <h1>📥 Dostupné soubory ke stažení</h1>
    <ul id="file-list">Načítám seznam souborů ze serveru...</ul>

    <script src="script.js"></script>
</body>
</html>
