<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chat</title>

<style>
body{
font-family:Arial;
background:#0f0f0f;
color:white;
text-align:center;
}

#container{
max-width:700px;
margin:auto;
}

#chat{
border:1px solid #444;
height:350px;
overflow-y:auto;
padding:10px;
margin-top:20px;
background:#181818;
text-align:left; /* Opraveno pro lepší čitelnost zpráv */
}

input,select{
padding:10px;
margin:5px;
border-radius:5px;
border:none;
}

button{
padding:10px;
border:none;
border-radius:5px;
background:#4CAF50;
color:white;
cursor:pointer;
}

/* Styl pro nové vysílací tlačítko */
.btn-transmit {
background: #ff3333;
font-weight: bold;
margin-left: 5px;
}

.btn-transmit:hover {
background: #cc0000;
}

#myid{
font-weight:bold;
font-size:18px;
color:#00ff9d;
}

/* Styl pro odkazy v chatu */
#chat a {
color: #00ff9d;
text-decoration: underline;
}
</style>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

</head>

<body>

<div id="container">

<h2>Chat</h2>

<p>Tvoje ID:</p>
<div id="myid">Generování...</div>

<br>

<label>Typ ID:</label>

<select id="idmode">
<option value="random">Random ID</option>
<option value="length">Random ID (custom length)</option>
<option value="stable">Stable ID</option>
<option value="stablelength">Stable ID (custom length)</option>
</select>

<br>

<input id="idlength" placeholder="Length (1-50)">
<input id="customid" placeholder="Your custom ID">

<br>

<button onclick="restartPeer()">Generate / Apply</button>

<hr>

<input id="peerid" placeholder="Enter friend ID">
<button onclick="connectPeer()">Připojit</button>

<div id="chat"></div>

<br>

<input id="msg" placeholder="Message">
<button onclick="sendMsg()">Poslat</button>
<!-- Nové tlačítko pro odeslání souřadnic -->
<button class="btn-transmit" onclick="transmitCoordinates()">Transmit Coordinates</button>

</div>

<script>

let peer
let connection

const idmode=document.getElementById("idmode")
const idlength=document.getElementById("idlength")
const customid=document.getElementById("customid")

function randomID(len){
const chars="abcdefghijklmnopqrstuvwxyz0123456789"
let result=""
for(let i=0;i<len;i++){
result+=chars[Math.floor(Math.random()*chars.length)]
}
return result
}

function start(peerID){
if(peer) peer.destroy()

peer = peerID ? new Peer(peerID) : new Peer()

peer.on("open",id=>{
document.getElementById("myid").textContent=id
})

peer.on("connection",conn=>{
connection=conn
setupConnection()
})

peer.on("error", err => {
alert("Chyba PeerJS: " + err.type)
console.error(err)
})
}

function restartPeer(){
let mode=idmode.value
let len=parseInt(idlength.value)

if(mode==="random"){
start()
}

if(mode==="length"){
if(!len || len<1 || len>50){
alert("Length must be between 1 and 50")
return
}
start(randomID(len))
}

if(mode==="stable"){
let id=customid.value.trim()
if(id===""){
alert("Enter custom ID")
return
}
start(id)
}

if(mode==="stablelength"){
let id=customid.value.trim()
if(!len || len<1 || len>50){
alert("Length must be between 1 and 50")
return
}
if(id.length!==len){
alert("ID must be exactly "+len+" characters")
return
}
start(id)
}
}

function connectPeer(){
const id=document.getElementById("peerid").value.trim()
if(!id) return

connection=peer.connect(id)
setupConnection()
}

function setupConnection(){
connection.on("open",()=>{
addMessage("Systém: Připojeno!")
})

connection.on("data",data=>{
addMessage("Kamarád: " + data)
})

connection.on("close", ()=>{
addMessage("Systém: Spojení bylo ukončeno.")
})
}

function sendMsg(){
const input=document.getElementById("msg")
const text=input.value.trim()

if(!connection || text==="") return

connection.send(text)
addMessage("Ty: " + text)
input.value=""
}

/* Nová funkce pro získání a odeslání GPS souřadnic */
function transmitCoordinates(){
if(!connection){
alert("Nejprve se musíš připojit ke kamarádovi!")
return
}

if(!navigator.geolocation){
alert("Tvůj prohlížeč nepodporuje geolokaci.")
return
}

addMessage("Systém: Zjišťuji souřadnice...")

navigator.geolocation.getCurrentPosition(
(position) => {
const lat = position.coords.latitude
const lon = position.coords.longitude
const mapLink = `https://google.com{lat},${lon}`
const messageText = `Moje souřadnice: ${lat}, ${lon} | Odkaz: ${mapLink}`

connection.send(messageText)
addMessage("Ty: " + messageText)
},
(error) => {
alert("Nepodařilo se získat souřadnice. Povol přístup k poloze.")
console.error(error)
},
{
enableHighAccuracy: true,
timeout: 10000,
maximumAge: 0
}
)
}

function addMessage(msg){
const div=document.createElement("div")
div.style.marginBottom = "5px"

// Detekce URL adres a jejich převedení na klikatelné odkazy
const urlRegex = /(https?:\/\/[^\s]+)/g
if(urlRegex.test(msg)) {
div.innerHTML = msg.replace(urlRegex, (url) => `<a href="${url}" target="_blank">${url}</a>`)
} else {
div.textContent = msg
}

const chat = document.getElementById("chat")
chat.appendChild(div)
chat.scrollTop = chat.scrollHeight
}

// Spuštění při načtení
start()

</script>

</body>
</html>
