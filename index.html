<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stahování souborů</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 40px auto; 
            max-width: 800px;
            background: #f6f8fa; 
            color: #24292e; 
            padding: 0 20px;
        }
        h1 { 
            border-bottom: 1px solid #e1e4e8; 
            padding-bottom: 10px; 
            font-size: 24px;
        }
        ul { 
            list-style: none; 
            padding: 0; 
        }
        li { 
            margin: 10px 0; 
            background: white; 
            padding: 16px; 
            border: 1px solid #e1e4e8; 
            border-radius: 6px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        a { 
            text-decoration: none; 
            color: #0366d6; 
            font-weight: 600; 
        }
        a:hover { 
            text-decoration: underline; 
        }
        .size {
            color: #586069;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>📁 Dostupné soubory ke stažení</h1>
    <ul id="file-list">Načítám aktuální seznam souborů...</ul>

    <!-- Načtení externího skriptu -->
    <script src="script.js"></script>
</body>
</html>
