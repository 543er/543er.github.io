name: Generate Directory Listing

on:
  push:
    branches:
      - main  # Spustí se pokaždé, když nahraješ jakýkoliv nový soubor

permissions:
  contents: write

jobs:
  generate-listing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Opravený oficiální komunitní nástroj z GitHub Marketplace
      - name: Generate HTML Directory Index
        uses: jayanta525/github-pages-directory-listing@v4.0.0
        with:
          FOLDER: "."            # Indexuje hlavní root adresář
          EXCLUDE: "index.html README.md script.js" # Tyto soubory automaticky skryje ze seznamu

      # Robot automaticky nahraje nově vygenerovanou stránku k tobě na web
      - name: Deploy generated index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff-index --quiet HEAD || git commit -m "Automatický update seznamu souborů"
          git push origin main
